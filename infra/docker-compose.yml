# Explicit project name — do NOT remove. This host runs multiple unrelated
# compose projects; without this, Compose derives the project name from the
# directory basename ("infra"), which collides with other projects also
# named "infra" and can recreate/overwrite their containers and volumes.
name: meu-guarda-roupa

services:
  postgres:
    image: postgres:16-alpine
    container_name: meu-guarda-postgres
    hostname: meu-guarda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: meu-guarda-minio
    hostname: meu-guarda-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Tightened CORS — only the app domain.
      MINIO_API_CORS_ALLOW_ORIGIN: "https://${APP_HOST}"
    volumes:
      - minio_data:/data
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.meu-guarda-minio.rule=Host(`minio.${APP_HOST}`)"
      - "traefik.http.routers.meu-guarda-minio.entrypoints=websecure"
      - "traefik.http.routers.meu-guarda-minio.tls.certresolver=letsencrypt"
      - "traefik.http.services.meu-guarda-minio.loadbalancer.server.port=9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: ../backend
    container_name: meu-guarda-migrate
    hostname: meu-guarda-migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@meu-guarda-postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    # Run alembic upgrade then exit
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    profiles:
      - tools

  backend:
    build:
      context: ../backend
    container_name: meu-guarda-backend
    hostname: meu-guarda-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@meu-guarda-postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: meu-guarda-minio:9000
      # Presigned URLs handed to mobile app — need host-reachable IP.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_HOST: ${APP_HOST}
    volumes:
      - ./downloads:/app/downloads
      - ./updates:/app/updates
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.meu-guarda-backend.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.meu-guarda-backend.entrypoints=websecure"
      - "traefik.http.routers.meu-guarda-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.meu-guarda-backend.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
  traefik_proxy:
    external: true

volumes:
  postgres_data:
  minio_data:
