server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed static assets — immutable cache (app versioned by content hash)
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # canvaskit.wasm — large, versioned by file content
    location = /canvaskit.wasm {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static HTML routes: try exact path, then $uri.html, then SPA fallback.
    # expo static export generates per-route .html files (login.html, closet.html…);
    # dynamic routes like /wardrobe/:id fall through to index.html where the
    # JS router resolves them client-side.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
    }
}
